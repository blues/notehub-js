name: Publish switch

on:
  release:
    types: [published]
  push:
    branches:
      - "test-release-**"
    paths:
      - "openapi.yaml"

permissions:
  id-token: write # Required for OIDC
  contents: write # Required for beta version updates

# A newer push to the same test-release branch supersedes an older beta; never cancel a release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  publish-prod:
    if: github.event_name == 'release'
    uses: ./.github/workflows/publish-prod-npm.yml
    permissions:
      id-token: write
      contents: read

  publish-beta:
    if: github.event_name == 'push'
    uses: ./.github/workflows/publish-beta-npm.yml
    permissions:
      id-token: write
      contents: write
