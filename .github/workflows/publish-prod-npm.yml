name: Publish production to npm

on:
  workflow_call:

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup .npmrc file to publish to npm
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      # npm (not pnpm) performs the publish because it reliably supports npm's
      # tokenless OIDC trusted publishing; pnpm publish currently 404s under OIDC
      # (pnpm/pnpm#11513). OIDC requires npm >= 11.5.1.
      - name: Update npm
        run: sudo npm install -g npm@latest

      - name: Verify npm version
        run: npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish to npm
        run: npm publish --provenance --access public
